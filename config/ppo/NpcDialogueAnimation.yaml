behaviors:
  NpcDialogueAnimation:
    trainer_type: ppo

    hyperparameters:
      # Small discrete action space (5 actions), single-NPC local context,
      # and short dialogue reaction windows. Keep updates frequent.
      batch_size: 256
      buffer_size: 1024
      learning_rate: 0.0002
      learning_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

      # Dialogue body-language still benefits from memory because the agent needs
      # to remember the recent speaking beat and avoid repetitive animations.
      memory:
        sequence_length: 32
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.003
        network_settings:
          hidden_units: 64
        learning_rate: 0.0002

    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 1000

# Observation contract (NpcDialogueAnimationAgent)
# 15 floats:
# [0]  player proximity
# [1]  normalized player health
# [2]  player in combat
# [3]  fresh dialogue context flag
# [4]  speaking window flag
# [5]  context intensity
# [6]  normalized response length
# [7]  greeting tone
# [8]  question tone
# [9]  warning tone
# [10] aggressive tone
# [11] positive tone
# [12] current action normalized
# [13] controller ready flag
# [14] time since last action normalized

# Action contract (1 discrete branch, size 5)
# 0 = HoldNeutral
# 1 = IdleVariant
# 2 = TurnLeft
# 3 = TurnRight
# 4 = EmphasisReact
