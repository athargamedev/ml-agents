name: Unity CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  UNITY_VERSION: "6000.4.0b9"
  PROJECT_PATH: DevProject

jobs:
  # Run EditMode tests with coverage
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:$UNITY_VERSION-linux
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-EditMode-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-EditMode-

      - name: Run EditMode Tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xvfb-run --auto-servernum -- /opt/unity-editor/Editor/Unity \
            -projectPath $(pwd) \
            -editmode \
            -runTests \
            -testPlatform EditMode \
            -testResults EditModeResults.xml \
            -logFile /dev/stdout

      - name: Generate Coverage Report
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xvfb-run --auto-servernum -- /opt/unity-editor/Editor/Unity \
            -projectPath $(pwd) \
            -editorTestsCommand "GenerateCoverageReport" \
            -logFile /dev/stdout

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ env.PROJECT_PATH }}/EditModeResults.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-coverage-report
          path: ${{ env.PROJECT_PATH }}/CoverageReport

  # Run PlayMode tests with coverage
  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:$UNITY_VERSION-linux
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-PlayMode-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-PlayMode-

      - name: Run PlayMode Tests
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xvfb-run --auto-servernum -- /opt/unity-editor/Editor/Unity \
            -projectPath $(pwd) \
            -playmode \
            -runTests \
            -testPlatform PlayMode \
            -testResults PlayModeResults.xml \
            -logFile /dev/stdout

      - name: Generate Coverage Report
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xvfb-run --auto-servernum -- /opt/unity-editor/Editor/Unity \
            -projectPath $(pwd) \
            -editorTestsCommand "GenerateCoverageReport" \
            -logFile /dev/stdout

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-test-results
          path: ${{ env.PROJECT_PATH }}/PlayModeResults.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-coverage-report
          path: ${{ env.PROJECT_PATH }}/CoverageReport

  # Validate API files (Unity Coding)
  api-validation:
    name: API Validation
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:$UNITY_VERSION-linux
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-API-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-API-

      - name: Validate API Files
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xvfb-run --auto-servernum -- /opt/unity-editor/Editor/Unity \
            -projectPath $(pwd) \
            -batchmode \
            -editorTestsCommand "ValidateApiFiles" \
            -logFile /dev/stdout
        env:
          UNITY_API_VALIDATION: true

  # Combined coverage report (requires both test runs)
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [editmode-tests, playmode-tests]
    if: always()
    steps:
      - name: Download EditMode Coverage
        uses: actions/download-artifact@v4
        with:
          name: editmode-coverage-report
          path: CoverageReport-EditMode
          continue-on-error: true

      - name: Download PlayMode Coverage
        uses: actions/download-artifact@v4
        with:
          name: playmode-coverage-report
          path: CoverageReport-PlayMode
          continue-on-error: true

      - name: Generate Summary
        run: |
          echo "## Unity Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Check EditMode results
          if [ -d "CoverageReport-EditMode" ]; then
            echo "| EditMode Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            echo "| EditMode Coverage | 📊 Available |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| EditMode Tests | ⚠️ Skipped/Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check PlayMode results
          if [ -d "CoverageReport-PlayMode" ]; then
            echo "| PlayMode Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            echo "| PlayMode Coverage | 📊 Available |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| PlayMode Tests | ⚠️ Skipped/Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts to view detailed HTML coverage reports." >> $GITHUB_STEP_SUMMARY

  # Code format check
  code-format:
    name: Code Format Check
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:$UNITY_VERSION-linux
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Code Formatting
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          # Unity Coding package will auto-format on save
          # This step checks if there are any uncommitted formatting changes
          git diff --name-only -- '*.cs' > formatted_files.txt
          if [ -s formatted_files.txt ]; then
            echo "## Code Formatting Issues Found" >> $GITHUB_STEP_SUMMARY
            cat formatted_files.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
